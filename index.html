<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Heat Leaderboard</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://leaderboard.thisisneverwork.com">
<meta property="og:title" content="Brand Heat Leaderboard — Who's winning on Instagram?">
<meta property="og:description" content="Who is ahead, who is falling behind, and what to look at next. Instagram performance for surf, skate, snow, outdoor and lifestyle brands, athletes and creators.">
<meta property="og:image" content="https://leaderboard.thisisneverwork.com/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/jsu4eyn.css">
<style>
:root{
  /* Neutrals + Empire Green + one warning colour. Colour only ever means: green = ahead / you, orange = behind, grey = in the pack. */
  --bg:#0E0F0D; --surface:#161813; --raised:#1E211B; --line:#2B2E27;
  --text:#F2EEE3; --mid:#BDB9AC; --muted:#8C8A7F;
  --green:#7EB801; --green-ink:#7EB801; --on-green:#10110F;
  --signal:#E8683A; --on-signal:#10110F;
  --green-soft:rgba(126,184,1,.12); --signal-soft:rgba(232,104,58,.12);
  --sans:"helvetica-neue-lt-pro","Helvetica Neue LT Pro","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"ivypresto-display","IvyPresto Display",Georgia,"Times New Roman",serif;
}
:root.light{
  --bg:#F5F3EA; --surface:#FFFFFF; --raised:#ECE9DE; --line:#D9D5C7;
  --text:#161713; --mid:#45443C; --muted:#6B6A60;
  --green-ink:#4B7000; --signal:#C4481F; --on-signal:#FFFFFF;
  --green-soft:rgba(126,184,1,.16); --signal-soft:rgba(196,72,31,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* top bar */
.bar{border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{height:22px;width:auto;color:var(--text);display:block}
.logo svg{height:22px;width:auto;display:block}
.bar .name{font-size:13px;font-weight:600;color:var(--mid);padding-left:16px;border-left:1px solid var(--line)}
.bar .sp{flex:1}
.bar .win{font-size:12px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);color:var(--mid);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600}
.ghost:hover{border-color:var(--green);color:var(--text)}

/* filters */
.filters{padding:20px 0 4px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--green);color:var(--on-green)}
:root.light .seg button.on{background:#10110F;color:#F4F0E6}
:root.light .btn:not(.o){background:#10110F;color:#F4F0E6;border-color:#10110F}
:root.light .mini.sl.on{background:#10110F;color:#F4F0E6;border-color:#10110F}
.disc{display:flex;gap:4px;flex-wrap:wrap}
.disc button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.disc button:hover{color:var(--text)}
.disc button.on{color:var(--text);border-bottom-color:var(--green)}
.disc button[disabled]{opacity:.3;cursor:not-allowed}
.find{position:relative;min-width:200px;flex:0 1 320px}
.find input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text)}
.find input::placeholder{color:var(--muted)}
.find input:focus{outline:none;border-color:var(--green)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:30;max-height:300px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--raised)}
.results small{display:block;color:var(--muted);font-size:11px}
.results .none{padding:12px;color:var(--mid);font-size:13px}
.results .none button{display:inline;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-top:8px;color:var(--text)}

/* hero: the three-second read */
.hero{padding:28px 0 8px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5.2vw,48px);line-height:1.08;letter-spacing:-.01em;margin:10px 0 14px}
.hero h1 em{font-style:normal;color:var(--green-ink)}
.tally{display:flex;gap:22px;flex-wrap:wrap;font-size:15px;font-weight:600;margin-bottom:12px}
.tally span{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.a{background:var(--green)}.dot.p{background:var(--muted)}.dot.b{background:var(--signal)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line)}
.split i{display:block;height:100%}
.split .a{background:var(--green)}.split .p{background:var(--muted);opacity:.55}.split .b{background:var(--signal)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}

/* worth a closer look */
.look{margin:28px 0 8px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sect h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.sect span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:block;width:100%}
.card:hover{border-color:var(--green)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-bottom:10px}
.tag.a{background:var(--green-soft);color:var(--green-ink)}
.tag.b{background:var(--signal-soft);color:var(--signal)}
.tag.n{background:var(--raised);color:var(--mid)}
.card h3{font-size:16px;font-weight:700}
.card p{font-size:13px;color:var(--mid);margin-top:4px}

/* your position */
.you{margin:24px 0 8px;background:var(--surface);border:1px solid var(--green);border-radius:16px;padding:20px}
.you-top{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.big{font-family:var(--serif);font-weight:600;font-size:64px;line-height:1;min-width:84px}
.big.a{color:var(--green-ink)}.big.b{color:var(--signal)}.big.p{color:var(--text)}
.you h2{font-size:20px;font-weight:700}
.you .sub{color:var(--mid);font-size:13px;margin-top:2px}
.you .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;margin-top:2px}
.stat .d{font-size:12px;font-weight:600}
.d.up{color:var(--green-ink)}.d.dn{color:var(--signal)}.d.eq{color:var(--muted)}
.todo{margin-top:18px;display:grid;gap:10px}
.todo-i{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.todo-i b{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-top:1px}
.todo-i b.gap{background:var(--signal-soft);color:var(--signal)}
.todo-i b.win{background:var(--green-soft);color:var(--green-ink)}
.todo-i b.fact{background:var(--raised);color:var(--mid)}
.todo-i p{font-size:14px;color:var(--text)}
.rivals{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rv{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.rv:hover{border-color:var(--green)}
.rv .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rv .n{font-weight:700;margin-top:2px}.rv .m{font-size:12px;color:var(--mid)}

/* buttons */
.btn{border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;border:1px solid var(--green);background:var(--green);color:var(--on-green)}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:none;color:var(--text);border-color:var(--line)}
.btn.o:hover{border-color:var(--green)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* list */
.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:32px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--mid);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--green)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.table{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thead,.row{display:grid;grid-template-columns:40px minmax(0,1.6fr) 110px minmax(0,1fr) minmax(0,.9fr) 96px;gap:12px;align-items:center;padding:12px 16px}
.thead{background:var(--raised);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:9px;padding-bottom:9px}
.row{border-top:1px solid var(--line);cursor:pointer;position:relative}
.row:hover{background:var(--raised)}
.row.me{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green)}
.rk{font-size:13px;font-weight:700;color:var(--muted)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{position:relative;width:36px;height:36px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mid);overflow:hidden;flex:0 0 auto}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--raised)}
.who .t{min-width:0}
.who .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .hd{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you-chip{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--green);color:var(--on-green);border-radius:4px;padding:1px 5px;margin-left:6px}
.heat{display:inline-flex;align-items:baseline;gap:6px}
.pill{font-weight:800;font-size:16px;min-width:44px;text-align:center;border-radius:8px;padding:4px 8px}
.pill.a{background:var(--green);color:var(--on-green)}
.pill.p{background:var(--raised);color:var(--text);border:1px solid var(--line)}
.pill.b{background:var(--signal);color:var(--on-signal)}
.bandw{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bandw.a{color:var(--green-ink)}.bandw.p{color:var(--muted)}.bandw.b{color:var(--signal)}
.cell .v{font-weight:700;font-size:15px}
.cell .d{font-size:12px;font-weight:600}
.cell .d.eq{font-weight:500}
.mini{font-size:12px;font-weight:600;border:1px solid var(--line);background:none;border-radius:8px;padding:5px 9px;color:var(--mid)}
.mini:hover,.mini.on{border-color:var(--green);color:var(--text)}
.mini.on{background:var(--green-soft)}
.unr{opacity:.7}
.more{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px;font-weight:700;font-size:13px;color:var(--text)}
.more:hover{background:var(--raised)}
.more[hidden]{display:none}
.note{font-size:12px;color:var(--muted);margin:14px 2px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* method */
.method{margin:36px 0 0;border-top:1px solid var(--line);padding-top:8px}
details summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"–"}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 14px}
.mg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.mg b{display:block;font-size:13px}.mg i{font-style:normal;color:var(--green-ink);font-weight:800}
.mg p{font-size:12px;color:var(--mid);margin-top:4px}
.mtxt{font-size:13px;color:var(--mid);max-width:720px;margin-bottom:10px}
footer{padding:28px 0 60px;font-size:12px;color:var(--muted)}

/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:90}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;z-index:100;overflow:auto;padding:22px}
.drawer.on{transform:none}
.dx{float:right;background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}
.dh{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.dh .av{width:48px;height:48px;font-size:15px}
.dh h2{font-size:19px;font-weight:700;line-height:1.2}
.dh p{font-size:12px;color:var(--muted)}
.verdict{font-family:var(--serif);font-size:22px;line-height:1.25;margin:6px 0 16px}
.dsec{margin-top:20px}
.dsec h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.post{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--bg)}
.post:hover{border-color:var(--green)}
.post .pm{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.post .pm b{color:var(--text)}
.post p{font-size:13px;color:var(--mid)}
.fmt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--raised);color:var(--mid);border-radius:4px;padding:1px 6px}
.bars .br{display:grid;grid-template-columns:130px 1fr 32px;gap:10px;align-items:center;font-size:12px;color:var(--mid);margin-bottom:8px}
.bars .tr{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--green)}
.bars .nv{font-weight:700;color:var(--text);text-align:right}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}

.modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:32px 14px;background:rgba(0,0,0,.6);z-index:120}
.modal.on{display:flex}
.mbody{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:940px;width:100%}
.mtop{display:flex;justify-content:space-between;gap:12px}
.mtop h2{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
.mtop .hd{font-size:12px;color:var(--muted)}
.warn{margin-top:12px;padding:10px 12px;border:1px solid var(--signal);border-radius:10px;font-size:13px;color:var(--mid)}
.ct{overflow-x:auto;margin-top:14px}
.ct table{border-collapse:collapse;width:100%;font-size:13px}
.ct th,.ct td{padding:11px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;min-width:130px}
.ct th:first-child,.ct td:first-child{min-width:110px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ct .v{font-size:20px;font-weight:700}.ct .v.best{color:var(--green-ink)}
.ct .s{font-size:12px;color:var(--muted)}
.ct .bar2{height:4px;background:var(--line);border-radius:2px;margin:6px 0}.ct .bar2 i{display:block;height:100%;background:var(--green);border-radius:2px}
.read{font-size:14px;color:var(--mid);margin-top:14px;max-width:70ch}.read b{color:var(--text)}


.cfrow[hidden]{display:none}
.cfrow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:600}
.cfrow select{margin-left:6px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600}
.cfrow .cnt{margin-left:auto;font-weight:500}
.rowbtns{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.rowbtns .mini{white-space:nowrap;padding:4px 7px}
.mini.sl.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.slt{overflow-x:auto;margin-top:14px}
.slt table{border-collapse:collapse;width:100%;font-size:13px}
.slt th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px}
.slt td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top}
.slt .nm{font-weight:700}.slt .hd{font-size:12px;color:var(--muted)}
.slt .tg{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:0 4px 4px 0;color:var(--mid)}
.slt .tg.up{border-color:var(--green);color:var(--green-ink)}
.slt .tg.wn{border-color:var(--signal);color:var(--mid)}
.slt a{color:var(--text)}
.sact{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#tray{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:none;gap:10px;align-items:center;flex-wrap:wrap;z-index:80}
#tray.on{display:flex}
#chips2{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tc{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:12px}
.tc.f{border-color:var(--green)}
.tc button{background:none;border:0;color:var(--muted);font-size:15px;margin-left:2px}
#tmsg{font-size:12px;color:var(--signal)}

@media (max-width:820px){
  .cards{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .rivals{grid-template-columns:1fr}
  .mgrid{grid-template-columns:1fr 1fr}
  .thead,.row{grid-template-columns:28px minmax(0,1.6fr) 84px minmax(0,1fr) 78px}
  .thead>:nth-child(5),.row>:nth-child(5){display:none}
  .bar .name{display:none}
  .bar .wrap{gap:10px}
  .find{min-width:0;flex:1 1 auto}
}
@media (max-width:480px){
  .wrap{padding:0 14px}
  .stats{grid-template-columns:1fr}
  .big{font-size:52px}
  .you .acts{margin-left:0}
}

/* how tab */
.howtab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 10px;font-size:13px;font-weight:700;color:var(--green-ink);margin-left:auto}
.howtab.on{border-bottom-color:var(--green);color:var(--text)}
:root:not(.light) .howtab{color:var(--green)}
.linkbtn{background:none;border:0;color:var(--green-ink);font-weight:700;text-decoration:underline;font-size:inherit}
:root:not(.light) .linkbtn{color:var(--green)}
#how{display:none;padding:28px 0 8px}
.howview #how{display:block}
.howview #typeSeg,.howview #findcard,.howview #hero,.howview #meds,.howview #youWrap,.howview #look,.howview .listhead,.howview #cfilters,.howview .table,.howview #note,.howview .reqline,.howview .method{display:none!important}
.howview .filters{padding-top:12px}
#how .hh{max-width:760px}
#how h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.1;margin:6px 0 12px}
#how h1 em{font-style:italic;color:var(--green-ink)}
:root:not(.light) #how h1 em{color:var(--green)}
#how h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;margin:44px 0 8px}
#how .lead{font-size:16px;color:var(--mid);max-width:680px}
#how p{font-size:14px;color:var(--mid);max-width:720px}
#how .hp{margin-top:8px}

// ── SCORING ENGINE ────────────────────────────────────────────
// ── SCORING ENGINE ────────────────────────────────────────────
// Saves and shares excluded — not publicly available from Instagram.
// Public signals only: likes, comments, reel views where available.

// Follower tier definitions with ER ranges and midpoints
function getFollowerTier(followers) {
  if (followers <   10000) return { name:'Nano',     min:3.5, max:8.0, mid:5.75 };
  if (followers <   50000) return { name:'Micro',    min:2.5, max:5.0, mid:3.75 };
  if (followers <  500000) return { name:'Mid-tier', min:1.5, max:3.0, mid:2.25 };
  if (followers < 1000000) return { name:'Macro',    min:1.0, max:2.0, mid:1.50 };
  return                          { name:'Mega',     min:0.5, max:1.5, mid:1.00 };
}

// Size benchmark: is brand ER inside, above or below its tier range? Includes % delta.
function getSizeBenchmark(followers, er) {
  const t = getFollowerTier(followers);
  if (er >= t.max) {
    const pct = Math.round((er / t.max - 1) * 100);
    return `Above size benchmark (+${pct}%)`;
  }
  if (er >= t.min) return 'Within size benchmark';
  const pct = Math.round((1 - er / t.min) * 100);
  return `Below size benchmark (−${pct}%)`;
}

// Expected CDR by tier — small accounts naturally get more comments per like
function getExpectedCDR(followers) {
  if (followers <   10000) return 0.07;
  if (followers <   50000) return 0.05;
  if (followers <  500000) return 0.025;
  if (followers < 1000000) return 0.015;
  return 0.01;
}

let ER_FIT = {};
let ER_PTS = {}, ER_CACHE = {};
function expectedER(b) {
  const t = b.btype || 'brand', pts = ER_PTS[t];
  if (!pts) return getFollowerTier(b.followers).mid;
  const ck = t + b.followers + (b.handle || ''); if (ER_CACHE[ck]) return ER_CACHE[ck];
  const x = Math.log(b.followers);
  const near = pts.filter(p => p[2] !== b.handle).map(p => [Math.abs(p[0] - x), p[1]]).sort((p, q) => p[0] - q[0]).slice(0, 21).map(p => p[1]);
  return ER_CACHE[ck] = median(near);
}

function calcRaw(b) {
  const f = b.followers;
  const t = getFollowerTier(f);
  const engDepthRate      = ((b.avgLikes + b.avgComments) / f) * 100;
  const commentRate       = (Math.min(b.avgComments, 0.15 * b.avgLikes) / f) * 100;
  // Tier-adjusted ER: removes size bias so brands compare fairly within category
  const tierAdjEngRate    = engDepthRate / expectedER(b);
  // Comment Depth Ratio + tier adjustment (small accounts get more comments per like naturally)
  const commentDepthRatio = b.avgLikes > 0 ? b.avgComments / b.avgLikes : 0;
  const tierAdjCDR        = Math.min(commentDepthRatio, 0.15) / getExpectedCDR(f);
  const hasReels          = b.avgReelViews && b.avgReelViews > 0;
  const viewConvRate      = hasReels ? ((b.avgLikes + b.avgComments) / b.avgReelViews) * 100 : null;
  const reachRate         = hasReels ? (b.avgReelViews / f) * 100 : null;   // measured, not a size guess
  return {
    engDepthRate, commentRate, tierAdjEngRate, commentDepthRatio, tierAdjCDR,
    viewConvRate, reachRate, hasReels,
    sizeBenchmark: getSizeBenchmark(f, engDepthRate),
    tierName: t.name,
  };
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}

function calcMedians(brands) {
  const r = brands.map(calcRaw);
  const vcRates = r.filter(x => x.viewConvRate !== null).map(x => x.viewConvRate);
  return {
    engDepthRate:    median(r.map(x => x.engDepthRate)),
    commentRate:     median(r.map(x => x.commentRate)),
    tierAdjEngRate:  median(r.map(x => x.tierAdjEngRate)),
    tierAdjCDR:      median(r.map(x => x.tierAdjCDR)),
    viewConvRate:    vcRates.length >= 3 ? median(vcRates) : null,
    reachRate:       (() => { const v = r.filter(x => x.reachRate != null).map(x => x.reachRate); return v.length >= 3 ? median(v) : null; })(),
    posts30d:        median(brands.map(b => b.posts30d || 0)),
  };
}

function cap(v)  { return Math.min(v, 2.0); }
function idx(brand, med) { return cap(brand / (med || 1)); }

// IQ Score: public signals only (comment rate, engagement depth, view conversion)
function calcIQ(raw, med) {
  const commentIdx  = idx(raw.commentRate,  med.commentRate);
  const engDepthIdx = idx(raw.engDepthRate, med.engDepthRate);
  let iqRaw;
  if (raw.hasReels && med.viewConvRate) {
    const viewConvIdx = idx(raw.viewConvRate, med.viewConvRate);
    iqRaw = commentIdx*0.40 + engDepthIdx*0.30 + viewConvIdx*0.20 + 1.0*0.10;
  } else {
    iqRaw = commentIdx*0.50 + engDepthIdx*0.35 + 1.0*0.15;
  }
  const iqIdx   = Math.min(iqRaw, 2.0);
  const iqScore = Math.min(100, Math.round(iqIdx * 50));
  return { commentIdx, engDepthIdx, iqIdx, iqScore };
}

// Activity/Community: tier-adj CDR (60%) × frequency boost (40%, capped 12/month)
function calcActivity(raw, med, posts30d) {
  const commentDepthIdx = med.tierAdjCDR > 0 ? cap(raw.tierAdjCDR / med.tierAdjCDR) : 1.0;
  const freqBoost       = Math.min(1.0, Math.sqrt((posts30d || 0) / 12));
  const activityIdx     = Math.min(2.0, commentDepthIdx * (0.6 + 0.4 * freqBoost));
  return { commentDepthIdx, freqBoost, activityIdx };
}

// Brand Heat Score: Reach 25% + Tier-Adj Engagement 35% + Activity/Community 25% + IQ 15%
// All inputs are tier-normalised before category comparison — size bias removed.
function calcHeat(raw, med, iq, activity) {
  const ri = (raw.reachRate != null && med.reachRate) ? idx(raw.reachRate, med.reachRate) : 1.0;
  const ei = idx(raw.tierAdjEngRate,  med.tierAdjEngRate);
  const heatScore = Math.min(100, Math.round((ri*0.25 + ei*0.35 + activity.activityIdx*0.25 + iq.iqIdx*0.15) * 50));
  return { reachIdx: ri, engIdx: ei, heatScore };
}

// Main Gap: plain-English diagnosis of the weakest scoring component
function getMainGap(raw, med, h, activity, iq, conf) {
  if (conf.level === 'Low') return 'Low confidence sample';
  const gaps = [
    { label:'Low reach',               score: h.reachIdx },
    { label:'Weak engagement for size', score: idx(raw.tierAdjEngRate, med.tierAdjEngRate) },
    { label:'Low conversation',        score: activity.commentDepthIdx },
    { label:'Inconsistent posting',    score: Math.min(1.0, Math.sqrt((raw.posts30d||0) / 12)) + 0.5 },
  ];
  const weakest = gaps.reduce((a, b) => a.score < b.score ? a : b);
  return weakest.score >= 0.9 ? 'No major gap' : weakest.label;
}

function confidence(brands) {
  const n = brands.length, p = brands.reduce((s,b) => s + (b.posts30d||0), 0);
  if (n < 5 || p < 10)    return { level:'Early data',  cls:'conf-low',    tip:'Small sample — rankings are directional. Coverage grows as we add more brands.' };
  if (n >= 10 && p >= 50) return { level:'Strong data', cls:'conf-high',   tip:'Large sample across many brands and posts — rankings are reliable.' };
  return                         { level:'Solid data',  cls:'conf-medium', tip:'Good sample — rankings reflect real trends in this category.' };
}

let currentRanked = [];

const MICRO_THRESHOLD = 5000; // below this: tracked, not ranked
const MIN_POSTS = 5;           // fewer own posts in the window: tracked, not ranked

function computeRanked(brands) {
  // Split into rankable brands and micro accounts
  const okAcc    = b => !b.tracked && (b.followers || 0) >= MICRO_THRESHOLD && (b.own || 0) >= MIN_POSTS;
  const rankable = brands.filter(okAcc);
  const micro    = brands.filter(b => !okAcc(b) && (b.followers || 0) > 0);

  // Medians and confidence only from rankable brands
  const med  = calcMedians(rankable);
  const conf = confidence(rankable);

  const ranked = rankable.map(b => {
    const raw      = calcRaw(b);
    const iq       = calcIQ(raw, med);
    const activity = calcActivity(raw, med, b.posts30d);
    const h        = calcHeat(raw, med, iq, activity);
    const mainGap  = getMainGap(raw, med, h, activity, iq, conf);
    return {
      ...b, ...raw, ...iq, ...activity, ...h, med, conf, mainGap, isMicro: false,
      vsEngCat: Math.round((raw.engDepthRate / (med.engDepthRate || 1) - 1) * 100),
    };
  }).sort((a, b) => b.heatScore - a.heatScore || b.engDepthRate - a.engDepthRate);
  ranked.forEach((b, i) => { b.rank = i + 1; b.pn = ranked.length; });

  // Append micro accounts at the bottom, flagged
  const microTagged = micro.map(b => ({
    ...b, isMicro: true, heatScore: null, med, conf,
    microReason: b.tracked ? b.tracked : (b.followers || 0) < MICRO_THRESHOLD ? 'Under 5K followers' : `Only ${b.own} post${b.own === 1 ? '' : 's'} in ${LB.days} days`,
    engDepthRate: b.followers > 0 ? ((b.avgLikes + b.avgComments) / b.followers) * 100 : 0,
    commentDepthRatio: b.avgLikes > 0 ? b.avgComments / b.avgLikes : 0,
    tierName: getFollowerTier(b.followers).name,
  }));

  currentRanked = [...ranked, ...microTagged];
  return currentRanked;

  if (window.Tally && Tally.openPopup) { Tally.openPopup(TALLY_ID, { layout: 'modal', width: 560, autoClose: 3000, hideTitle: false, emoji: { text: '👋', animation: 'wave' } }); return; }
  window.open('https://tally.so/r/' + TALLY_ID, '_blank', 'noopener');
}

function renderHero(sc, um, label) {
  if (!sc.length) { $('#hero').innerHTML = `<div class="eyebrow">${esc(label)}</div><h1>No ranked accounts here yet.</h1>`; return; }
  const n = { a: 0, p: 0, b: 0 }; sc.forEach(b => n[band(b.heatScore)]++);
  const lead = sc[0];
  $('#hero').innerHTML = `
    <div class="eyebrow">${esc(label)} · ${sc.length} ranked · ${window.WIN}</div>
    <h1><em>${esc(lead.name)}</em> leads ${esc(label)}.</h1>
    <div class="tally"><span><i class="dot a"></i>${n.a} ahead</span><span><i class="dot p"></i>${n.p} in the pack</span><span><i class="dot b"></i>${n.b} behind</span></div>
    <div class="split" role="img" aria-label="${n.a} ahead, ${n.p} in the pack, ${n.b} behind"><i class="a" style="flex:${n.a}"></i><i class="p" style="flex:${n.p}"></i><i class="b" style="flex:${n.b}"></i></div>
    <p class="legend">Heat 60+ is ahead, 40 to 59 is in the pack, under 40 is behind. Scored against this group only.${sc.length < 8 ? ' Small group, so read it as directional.' : ''}</p>`;
}

function lookCards(sc) {
  if (sc.length < 6) return [];
  const pool = sc.filter(b => b.own >= 6).length >= 5 ? sc.filter(b => b.own >= 6) : sc;
  const medF = median(pool.map(b => b.followers)), cards = [];
  const over = pool.filter(b => b.followers <= medF && b.engIdx >= 1.2).sort((a, b) => b.engIdx - a.engIdx)[0];
  if (over) cards.push({ cls: 'a', tag: 'Punching above its size', b: over,
    text: `${pct(over.engDepthRate, 2)} engagement at ${fmtK(over.followers)} followers, ${ratioTxt(vsSize(over))} what is typical at that size.` });
  const top3 = [...pool].sort((a, b) => b.followers - a.followers).slice(0, Math.max(3, Math.round(pool.length / 3)));
  const quiet = top3.filter(b => b.heatScore < 50).sort((a, b) => b.followers - a.followers)[0];
  if (quiet) cards.push({ cls: 'b', tag: 'Big but quiet', b: quiet,
    text: `${fmtK(quiet.followers)} followers but Heat ${quiet.heatScore}. Engagement is ${pct(quiet.engDepthRate, 2)}, against ${pct(expectedER(quiet), 2)} typical at that size.` });
  const talk = pool.filter(b => b.commentDepthRatio <= 0.15).sort((a, b) => b.commentDepthIdx - a.commentDepthIdx)[0];
  if (talk) cards.push({ cls: 'n', tag: 'Starts conversations', b: talk,
    text: `${pct(talk.commentDepthRatio * 100)} of its likes turn into comments. Group median is ${pct(medCtl(sc) * 100)}.` });
  return cards;
}
function renderLook(sc) {
  const cs = lookCards(sc);
  $('#look').innerHTML = cs.length ? `<div class="sect"><h2>Worth a closer look</h2><span>Click for the detail</span></div>
    <div class="cards">${cs.map(c => `<button class="card" data-open="${c.b.hd}"><span class="tag ${c.cls}">${c.tag}</span><h3>${esc(c.b.name)}</h3><p>${c.text}</p></button>`).join('')}</div>` : '';
}

// advice: every line is computed from the numbers shown, nothing is generic filler
function advice(b, sc) {
  const out = [], lead = sc[0], rank = b.rank, above = rank > 1 ? sc[rank - 2] : null;
  const comps = [{ k: 'eng', name: 'engagement for your size', v: b.engIdx }, { k: 'conv', name: 'conversation', v: b.commentDepthIdx }];
  if (b.hasReels && b.med.reachRate) comps.push({ k: 'reach', name: 'Reel reach', v: b.reachIdx });
  const weak = comps.reduce((a, c) => c.v < a.v ? c : a), strong = comps.reduce((a, c) => c.v > a.v ? c : a);
  const mc = medCtl(sc);
  if (weak.v < 0.85) {
    if (weak.k === 'eng') out.push({ k: 'gap', t: `Engagement is the biggest gap. A typical post earns ${Math.round(b.avgLikes)} likes and ${Math.round(b.avgComments)} comments, ${pct(b.engDepthRate, 2)} of followers. Accounts your size typically earn ${pct(expectedER(b), 2)}${lead.hd !== b.hd ? `, and ${esc(lead.name)} earns ${pct(lead.engDepthRate, 2)}` : ''}. Open your best posts from the last ${LB.days} days, find what they share, and make more of that.` });
    else if (weak.k === 'conv') out.push({ k: 'gap', t: `Few people talk back. ${pct(b.commentDepthRatio * 100)} of your likes turn into comments, against a ${pct(mc * 100)} group median. Close posts with one specific question and reply to comments in the first hour.` });
    else out.push({ k: 'gap', t: `Your Reels reach ${pct(b.avgReelViews / b.followers * 100, 0)} of your followers per view, against ${pct(b.med.reachRate, 0)} typical in this group. The first two seconds decide that, so open on the payoff.` });
  } else if (b.heatScore >= 60) {
    out.push({ k: 'win', t: `No weak spot. Strongest area is ${strong.name}${strong.v >= 1.95 ? ', well clear of the group' : ', at ' + ratioTxt(strong.v) + ' the group median'}.` });
  } else {
    out.push({ k: 'fact', t: `Nothing is far off the group median. Moving up means improving ${weak.name} first, your lowest of the three.` });
  }
  if (above) {
    const cs = [{ n: 'engagement for size', a: above.engIdx, m: b.engIdx }, { n: 'conversation', a: above.commentDepthIdx, m: b.commentDepthIdx }];
    if (above.hasReels && b.hasReels && above.med.reachRate) cs.push({ n: 'Reel reach', a: above.reachIdx, m: b.reachIdx });
    const d = cs.reduce((x, c) => (c.a - c.m) > (x.a - x.m) ? c : x);
    const need = (above.engDepthRate - b.engDepthRate) / 100 * b.followers;
    out.push({ k: 'fact', t: `${esc(above.name)} (#${rank - 1}, Heat ${above.heatScore}) is the nearest target. They lead mainly on ${d.n}.${need > 0 && need < 1.5 * (b.avgLikes + b.avgComments) ? ` Matching their engagement means about ${Math.round(need)} more likes and comments per post.` : ''}` });
  } else if (sc.length > 1) {
    const nx = sc[1];
    out.push({ k: 'fact', t: `You lead by ${b.heatScore - nx.heatScore} points. ${esc(nx.name)} is closest.` });
  }
  // format: only when the format data exists and the gap is real
  const withF = sc.filter(x => x.fmt);
  if (b.fmt && withF.length >= 12) {
    const med = {}; ['reel','carousel','image'].forEach(f => { const v = withF.filter(x => x.fmt[f] && x.fmt[f].n >= 2 && x.fmt[f].er > 0).map(x => x.fmt[f].er); if (v.length >= 5) med[f] = median(v); });
    const fs = Object.keys(med).sort((x, y) => med[y] - med[x]);
    if (fs.length >= 2 && med[fs[0]] >= med[fs[fs.length-1]] * 1.25) {
      const bestF = fs[0], worstF = fs[fs.length-1], tot = Object.values(b.fmt).reduce((s, v) => s + v.n, 0), mine = tot ? (b.fmt[bestF] ? b.fmt[bestF].n : 0) / tot : 0;
      out.push({ k: 'fact', t: `In this group ${FMT_NAME[bestF].toLowerCase()}s earn the most per post (median ${pct(med[bestF], 2)} against ${pct(med[worstF], 2)} for ${FMT_NAME[worstF].toLowerCase()}s). ${Math.round(mine * 100)}% of your recent posts are ${FMT_NAME[bestF].toLowerCase()}s.` });
    }
  }
  // cadence: reported only as the pattern the data shows for this group
  if (sc.length >= 15) {
    const rho = spearman(sc.map(x => x.posts30d), sc.map(x => x.engDepthRate));
    if (rho <= -0.25) out.push({ k: 'fact', t: `In this group, accounts that post more earn less per post (correlation ${rho.toFixed(2)}). That is a pattern, not proof, but it says fix what each post earns before adding volume.` });
    else if (rho >= 0.25) out.push({ k: 'fact', t: `In this group, accounts that post more tend to earn more per post (correlation +${rho.toFixed(2)}). A pattern, not proof.` });
  }
  const main = out.slice(0, 3);
  if (b.own < 8) main.push({ k: 'fact', t: `Early read: this is based on ${b.own} posts, so one viral post can move it.` });
  return main;
}
const todoHtml = list => `<div class="todo">${list.map(x => `<div class="todo-i"><b class="${x.k}">${x.k === 'gap' ? 'Gap' : x.k === 'win' ? 'Strength' : 'Note'}</b><p>${x.t}</p></div>`).join('')}</div>`;

function postsHtml(b, title) {
  if (!b.top || !b.top.length) return '';
  return `<div class="dsec"><h3>${title || 'Best posts'}, last ${LB.days} days</h3>${b.top.map(p => `
    <a class="post" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="pm"><span class="fmt">${esc(FMT_NAME[p.f] || p.f)}</span><span><b>${fmtK(p.l)}</b> likes</span><span><b>${fmtK(p.c)}</b> comments</span>${p.v ? `<span><b>${fmtK(p.v)}</b> views</span>` : ''}<span>${esc(p.d)}</span></div>
      <p>${esc(p.cap || 'No caption')}${p.cap && p.cap.length >= 140 ? '…' : ''}</p></a>`).join('')}</div>`;
}

function renderYou(k, sc) {
  const w = $('#youWrap'), me = st.you && ALLBY[st.you];
  if (!me) { w.innerHTML = ''; return; }
  if (me.ladder !== k) {
    w.innerHTML = `<div class="you" style="padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span><b>Your account:</b> ${esc(me.name)} · ${esc(me.ladderLabel)}</span><span style="margin-left:auto;display:flex;gap:8px"><button class="btn o" data-act="goyou">Back to your group</button><button class="btn o" data-act="noyou">Clear</button></span></div>`;
    return;
  }
  if (me.isMicro) {
    w.innerHTML = `<div class="you"><div class="you-top"><div><h2>${esc(me.name)}</h2><p class="sub">${esc(me.handle)}</p></div><div class="acts"><button class="btn o" data-act="noyou">Clear</button></div></div><div class="todo"><div class="todo-i"><b class="fact">Not ranked</b><p>${esc(me.microReason)}. ${me.tracked ? 'Tracked, but there is nothing fair to score yet.' : 'Keep posting and it joins the ranking at the next refresh.'}</p></div></div></div>`;
    return;
  }
  const bd = band(me.heatScore), above = me.rank > 1 ? sc[me.rank - 2] : null, below = me.rank < sc.length ? sc[me.rank] : null;
  const em = engMul(me), cm = ctlMul(me, sc);
  const rv = (lab, o) => !o ? '' : `<button class="rv" data-open="${o.hd}"><div class="k">${lab}</div><div class="n">${esc(o.name)}</div><div class="m">#${o.rank} · Heat ${o.heatScore} · ${pct(o.engDepthRate, 2)} engagement</div></button>`;
  w.innerHTML = `<div class="you">
    <div class="you-top">
      <div class="big ${bd}">${me.heatScore}</div>
      <div><div class="eyebrow">${st.type === 'creator' ? 'Your stats' : 'Your position'}</div><h2>${esc(me.name)} <span class="bandw ${bd}" style="margin-left:6px">${BAND[bd]}</span></h2>
        <p class="sub">#${me.rank} of ${me.pn} in ${esc(me.ladderLabel)}. Ahead of ${me.pn - me.rank} of ${me.pn - 1} others.</p></div>
      <div class="acts"><button class="btn" data-act="top3">Compare with the top 3</button><button class="btn o" data-card="${me.hd}">Download report card</button><button class="btn o" data-act="noyou">Clear</button></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Engagement</div><div class="v">${pct(me.engDepthRate, 2)}</div><div class="d ${em.c}">${em.t}</div></div>
      <div class="stat"><div class="k">Conversation</div><div class="v">${pct(me.commentDepthRatio * 100)}</div><div class="d ${cm.c}">${cm.t}</div></div>
      <div class="stat"><div class="k">Followers</div><div class="v">${fmtK(me.followers)}</div><div class="d eq">${esc(tierShort(me))} tier · ~${P(me.posts30d)} posts a month</div></div>
    </div>
    ${todoHtml(advice(me, sc))}
    <div class="rivals">${rv('Next target above you', above)}${rv('Closest behind you', below)}</div>
    ${postsHtml(me, 'Your best posts')}
  </div>`;
}

function rowHtml(b, rank, k, sc) {
  const me = st.you === b.hd;
  const chk = cmp.indexOf(b.hd) >= 0;
  if (b.isMicro) return `<div class="row unr${me ? ' me' : ''}" data-open="${b.hd}"><div class="rk">–</div><div class="who">${avHtml(b)}<div class="t"><div class="nm">${esc(b.name)}</div><div class="hd">${esc(b.handle)}</div></div></div><div><span class="bandw p">Not ranked</span></div><div class="cell" style="grid-column:span 2"><div class="d eq">${esc(b.microReason)}</div></div><div></div></div>`;
  const bd = band(b.heatScore), em = engMul(b), cm = ctlMul(b, sc);
  return `<div class="row${me ? ' me' : ''}" data-open="${b.hd}">
    <div class="rk">${rank}</div>
    <div class="who">${avHtml(b)}<div class="t"><div class="nm">${esc(b.name)}${me ? '<span class="you-chip">You</span>' : ''}</div><div class="hd">${esc(b.handle)} · ${fmtK(b.followers)}</div></div></div>
    <div class="heat"><span class="pill ${bd}">${b.heatScore}</span></div>
    <div class="cell"><div class="v">${pct(b.engDepthRate, 2)}</div><div class="d ${em.c}">${em.t}</div></div>
    <div class="cell"><div class="v">${pct(b.commentDepthRatio * 100)}</div><div class="d ${cm.c}">${cm.t}</div></div>
    <div class="rowbtns">${b.btype === 'creator' ? `<button class="mini sl${short.indexOf(b.hd) >= 0 ? ' on' : ''}" data-short="${b.hd}">${short.indexOf(b.hd) >= 0 ? '★ Shortlisted' : '☆ Shortlist'}</button>` : ''}<button class="mini${chk ? ' on' : ''}" data-cmp="${b.hd}">${chk ? '✓ Added' : '+ Compare'}</button></div>
  </div>`;
}
const avFile = hd => /^quiksilver/i.test(hd) ? 'quiksilver' : hd;   // any Quiksilver region uses the one logo
const avHtml = b => `<div class="av"><img src="instagram_avatars/images/${avFile(b.hd)}.jpg" alt="" onerror="this.remove()"><span>${esc(initialsOf(b.name))}</span></div>`;

function renderList(k, sc, um, label) {
  const n = { a: 0, p: 0, b: 0 }; sc.forEach(b => n[band(b.heatScore)]++);
  const chips = [['all', 'All', sc.length], ['a', 'Ahead', n.a], ['p', 'In the pack', n.p], ['b', 'Behind', n.b], ['u', 'Not ranked', um.length]];
  $('#bandChips').innerHTML = chips.map(c => `<button class="chip${st.band === c[0] ? ' on' : ''}" data-band="${c[0]}" ${c[2] ? '' : 'disabled'}>${c[1]} <span>${c[2]}</span></button>`).join('');
  $('#listTitle').textContent = 'Ranking · ' + label;
  let list;
  if (st.band === 'u') list = um.map(b => [b, '–']);
  else list = sc.map((b, i) => [b, b.rank]).filter(([b]) => st.band === 'all' || band(b.heatScore) === st.band);
  const cf = $('#cfilters');
  if (st.band !== 'u') {
    const sz = SIZES.find(s => s[0] === st.size) || SIZES[0], before = list.length;
    list = list.filter(([b]) => b.followers >= sz[2] && b.followers < sz[3]);
    if (st.sort !== 'heat') list.sort((p, q) => sortVal[st.sort](q[0]) - sortVal[st.sort](p[0]));
    cf.hidden = false;
    cf.innerHTML = `<label>Size <select data-f="size">${SIZES.map(s => `<option value="${s[0]}"${st.size === s[0] ? ' selected' : ''}>${s[1]}</option>`).join('')}</select></label>
      <label>Sort by <select data-f="sort">${SORTS.map(s => `<option value="${s[0]}"${st.sort === s[0] ? ' selected' : ''}>${s[1]}</option>`).join('')}</select></label>
      <span class="cnt">${list.length === before ? before + (st.type === 'creator' ? ' creators' : ' brands') : list.length + ' of ' + before + ' match'}.${st.type === 'creator' ? ' Pick the ones you like with Shortlist.' : ''}</span>`;
  } else { cf.hidden = true; cf.innerHTML = ''; }
  const LIM = 10, shown = st.all ? list : list.slice(0, LIM);
  let html = '';
  const me = st.you && ALLBY[st.you];
  if (me && me.ladder === k && !me.isMicro && st.band === 'all' && !st.all && me.rank > LIM) html += rowHtml(me, me.rank, k, sc) + '<div style="border-top:1px dashed var(--line)"></div>';
  html += shown.map(([b, r]) => rowHtml(b, r, k, sc)).join('') || '<div class="empty">Nothing in this view.</div>';
  // Always show 10 rows in the default view: fill short groups with tracked-but-not-ranked accounts, then open slots.
  if (st.band === 'all' && !st.all && st.size === 'any' && st.sort === 'heat' && list.length < LIM) {
    let fill = LIM - list.length;
    um.slice(0, fill).forEach(b => { html += rowHtml(b, '–', k, sc); });
    fill -= Math.min(fill, um.length);
    for (let i = 0; i < fill; i++) html += `<div class="row unr ph" data-act="request" tabindex="0" role="button"><div class="rk">+</div><div class="who"><div class="av"></div><div class="t"><div class="nm" style="color:var(--muted)">Request an account</div><div class="hd">Open slot. Click to request an account.</div></div></div></div>`;
  }
  $('#rows').innerHTML = html;
  const more = $('#more');
  if (list.length > LIM) { more.hidden = false; more.textContent = st.all ? 'Show top 10 only' : `Show all ${list.length}`; } else more.hidden = true;
  $('#note').textContent = um.length && st.band !== 'u' ? `${um.length} more tracked but not ranked: under 5K followers, fewer than ${MIN_POSTS} posts in ${LB.days} days, hidden likes, or inactive.` : '';
}

// ── drawer ────────────────────────────────────────────────────
function openDrawer(hd) {
  const b = ALLBY[hd]; if (!b) return;
  const d = $('#drawer');
  if (b.isMicro) {
    d.innerHTML = `<button class="dx" data-act="close" aria-label="Close">×</button><div class="dh"><div class="av">${esc(initialsOf(b.name))}</div><div><h2>${esc(b.name)}</h2><p>${esc(b.handle)} · ${fmtK(b.followers)} followers · ${esc(b.ladderLabel)}</p></div></div>
      <div class="todo"><div class="todo-i"><b class="fact">Not ranked</b><p>${esc(b.microReason)}. ${b.tracked ? 'It is tracked here so the group is complete, but there is nothing fair to score.' : 'A score on this little data would swing on a single post, so it stays off the ladder.'}</p></div></div>${postsHtml(b)}`;
  } else {
    const sc = scored(b.ladder), bd = band(b.heatScore);
    const em = engMul(b), cm = ctlMul(b, sc), above = b.rank > 1 ? sc[b.rank - 2] : null;
    const bars = [['Engagement for size', b.engIdx * 50], ['Reel reach', b.hasReels && b.med.reachRate ? b.reachIdx * 50 : null], ['Community', b.activityIdx * 50], ['Interaction quality', b.iqScore]];
    d.innerHTML = `<button class="dx" data-act="close" aria-label="Close">×</button>
      <div class="dh">${avHtml(b)}<div><h2>${esc(b.name)}</h2><p>${esc(b.handle)} · ${esc(tierShort(b))} tier · ${fmtK(b.followers)} followers</p></div></div>
      <div class="heat" style="gap:10px"><span class="pill ${bd}" style="font-size:24px">${b.heatScore}</span><span class="bandw ${bd}">${BAND[bd]}</span></div>
      <p class="verdict">#${b.rank} of ${b.pn} in ${esc(b.ladderLabel)}. ${b.heatScore >= 60 ? 'Clear of most of the group.' : b.heatScore < 40 ? 'The group is outperforming this account.' : 'Level with the middle of the group.'}</p>
      <div class="stats" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat"><div class="k">Engagement</div><div class="v" style="font-size:20px">${pct(b.engDepthRate, 2)}</div><div class="d ${em.c}">${em.t}</div></div>
        <div class="stat"><div class="k">Conversation</div><div class="v" style="font-size:20px">${pct(b.commentDepthRatio * 100)}</div><div class="d ${cm.c}">${cm.t}</div></div>
        <div class="stat"><div class="k">Posts a month</div><div class="v" style="font-size:20px">${P(b.posts30d)}</div><div class="d eq">estimate</div></div>
      </div>
      ${b.commentDepthRatio > 0.15 ? '<p class="note">Very high comment ratio. This often comes from giveaway or contest posts, so treat the conversation number with care.</p>' : ''}
      <div class="dsec"><h3>What to do</h3>${todoHtml(advice(b, sc))}</div>
      ${postsHtml(b)}
      <div class="dsec bars"><h3>How the score is built</h3>${bars.map(([n, v]) => `<div class="br"><span>${n}</span><div class="tr"><i style="width:${v == null ? 0 : Math.max(0, Math.min(100, v))}%"></i></div><span class="nv">${v == null ? 'n/a' : Math.round(Math.min(100, v))}</span></div>`).join('')}
        <p class="note" style="margin-top:4px">Each bar is 0 to 100 against this group. 50 is the group median.</p></div>
      <div class="dact">
        <button class="btn" data-setyou="${b.hd}">${st.you === b.hd ? 'This is your account' : 'Set as my account'}</button>
        <button class="btn o" data-card="${b.hd}">Download report card</button>
        ${b.btype === 'creator' ? `<button class="btn o" data-short="${b.hd}">${short.indexOf(b.hd) >= 0 ? '★ On your shortlist' : '☆ Add to shortlist'}</button>` : ''}
        <button class="btn o" data-cmp="${b.hd}">${cmp.indexOf(b.hd) >= 0 ? '✓ In comparison' : '+ Compare'}</button>
      </div>`;
  }
  $('#ov').classList.add('on'); d.classList.add('on'); d.scrollTop = 0;
  const x = d.querySelector('.dx'); if (x) x.focus();
}
function closeDrawer() { $('#ov').classList.remove('on'); $('#drawer').classList.remove('on'); }

// ── set / clear account, search ───────────────────────────────
function setYou(hd) {
  const b = ALLBY[hd]; if (!b) return;
  st.view = 'rank'; st.you = hd; st.type = b.btype; st.disc = b.discipline; st.band = 'all'; st.all = false;
  closeDrawer(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function search(q) {
  const r = $('#results'); q = q.trim().toLowerCase().replace(/^@/, '');
  if (q.length < 2) { r.hidden = true; return; }
  const hits = Object.values(ALLBY).filter(b => b.name.toLowerCase().includes(q) || b.hd.toLowerCase().includes(q)).slice(0, 8);
  r.hidden = false;
  r.innerHTML = hits.length ? hits.map(b => `<button data-pick="${b.hd}">${esc(b.name)}<small>${esc(b.handle)} · ${esc(b.ladderLabel)}</small></button>`).join('')
    : `<div class="none">Not tracked yet.<br><button data-act="request">Request this account</button><br><small>Add it in a minute. We review requests each refresh.</small></div>`;
}

// ── compare ───────────────────────────────────────────────────

  if (b.hasReels && b.med.reachRate && b.reachRate >= b.med.reachRate * 1.5) t.push(['up', 'Strong Reel reach']);
  if (b.commentDepthRatio > 0.15) t.push(['wn', 'Check: giveaway-style comments']);
  else if (b.commentDepthRatio >= (medCtl(scored(b.ladder)) || 1) * 1.3) t.push(['up', 'Strong conversation']);
  if ((b.posts30d || 0) >= 8) t.push(['up', 'Posts often']);
  if (x <= 0.7) t.push(['wn', 'Engagement low for its size']);
  if (b.heatScore < 40 && !t.some(a => a[0] === 'up')) t.push(['wn', 'Behind its group']);
  return t;
}

  if ((el = c('[data-short]'))) { e.stopPropagation(); return toggleShort(el.dataset.short); }

  if ((el = c('[data-setyou]'))) return setYou(el.dataset.setyou);

    if (a === 'copyh') { try { navigator.clipboard.writeText(el.dataset.h); el.textContent = 'Copied'; } catch (x) {} return; }

    if (top.f === 'reel' && top.v) { playIcon(x, sx + 8, sy - 8, 12); sx += 24; const t1 = fmtK(top.v) + ' views  ·  '; x.fillText(t1, sx, sy); sx += x.measureText(t1).width; }
    heartIcon(x, sx + 9, sy - 8, 8); sx += 26; const t2 = fmtK(top.l) + ' likes  ·  ' + shortDate(top.d); x.fillText(t2, sx, sy);
  }
  // footer
  x.fillStyle = DIM; x.font = '400 19px ' + CARD_SANS;
  x.fillText('Ranked against ' + b.pn + ' ' + groupNoun(b) + ' on public posts, ' + LB.days + ' days to ' + dateLabel + '.', M, H - 84);
  x.fillStyle = CREAM; x.font = '700 19px ' + CARD_SANS; x.fillText('leaderboard.thisisneverwork.com', M, H - 54);
  return c;
}

// ── picker ────────────────────────────────────────────────────
const cardFile = (b, card) => 'neverwork-' + card.id + '-' + b.hd.replace(/[^a-z0-9_.-]/gi, '') + '-' + LB.generatedAt.slice(0, 7) + '.png';
const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
let CARD_SET = null;
async function buildCards(b) {
  await cardFonts();
  const M = typeof MEDIA !== 'undefined' ? MEDIA : { logos: {}, thumbs: {} };
  const [nw, logo, avatar, thumb] = await Promise.all([logoImg(), loadImg(M.logos[b.hd] ? 'brand-logos/' + M.logos[b.hd] : null),
    loadImg(M.logos[b.hd] ? null : 'instagram_avatars/images/' + avFile(b.hd) + '.jpg'), loadImg(M.thumbs[b.hd] ? 'card-thumbs/' + M.thumbs[b.hd] : null)]);
  return cardsFor(b).map(card => ({ card, canvas: renderCard(b, card, { nw, logo, avatar, thumb }) }));
}
async function downloadCard(hd) {
  const b = ALLBY[hd]; if (!b || b.isMicro) return;
  modalMode = 'cards';
  $('#mbody').innerHTML = `<div class="mtop"><div><div class="hd">${esc(monthLabel)} report cards</div><h2>${esc(b.name)}</h2></div><button class="dx" data-act="closem" aria-label="Close">×</button></div><p class="read">Building your cards…</p>`;
  $('#modal').classList.add('on');
  const set = await buildCards(b); CARD_SET = { b, set };
  if (modalMode !== 'cards') return;
  $('#mbody').innerHTML = `<div class="mtop"><div><div class="hd">${esc(monthLabel)} report cards · built from this month’s data</div><h2>${esc(b.name)}: pick a card</h2></div><button class="dx" data-act="closem" aria-label="Close">×</button></div>
    <div class="rcg">${set.map((s, i) => `<figure class="rc"><img src="${s.canvas.toDataURL('image/png')}" alt="${esc(s.card.title)} report card for ${esc(b.name)}"><figcaption><b>${esc(s.card.title)}</b><button class="btn o" data-dlcard="${i}">Download</button></figcaption></figure>`).join('')}</div>
    <p class="note">${set.length < 3 ? 'Only cards the numbers back up are shown. ' : ''}Every card shows the same rank and status, so none of them oversells.</p>
    <div class="dact">${set.length > 1 ? `<button class="btn" data-dlcard="all">Download all ${set.length}</button>` : ''}<button class="btn o" data-act="closem">Close</button></div>`;
}
async function saveCards(which) {
  if (!CARD_SET) return;
  const { b, set } = CARD_SET, pick = which === 'all' ? set : [set[+which]];
  const files = await Promise.all(pick.map(async s => new File([await toBlob(s.canvas)], cardFile(b, s.card), { type: 'image/png' })));
  // On phones, "Download all" opens the share sheet so the set can go straight to an Instagram carousel.
  if (which === 'all' && navigator.canShare && matchMedia('(pointer:coarse)').matches && navigator.canShare({ files })) {
    try { await navigator.share({ files, title: b.name + ' report cards' }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  files.forEach((f, i) => setTimeout(() => { const u = URL.createObjectURL(f), l = document.createElement('a'); l.href = u; l.download = f.name; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); }, i * 450));
}
document.addEventListener('click', e => { const el = e.target.closest('[data-dlcard]'); if (el) { e.stopPropagation(); saveCards(el.dataset.dlcard); } }, true);
(function cardCss() { const s = document.createElement('style'); s.textContent =
  '.rcg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:18px 0 6px}' +
  '.rc{margin:0;display:flex;flex-direction:column;gap:10px}.rc img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}' +
  '.rc figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}';
  document.head.append(s); })();

</script>
